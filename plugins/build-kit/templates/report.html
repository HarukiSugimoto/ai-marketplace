<!doctype html>
<!--
  build-kit レポートの HTML テンプレート。
  scripts/report.mjs が二重波かっこのプレースホルダを置換して出力する。

  * これは「生成物」ではなく「ソース」。リポジトリの .gitignore は *.html を除外しているが、
    このファイルだけ `!plugins/build-kit/templates/report.html` で例外にしてある。
  * プレースホルダを増減したら report.mjs の vars も直すこと。
    vars に無いものが残っていると report.mjs がエラーで落ちる（黙って空にしない）。
    このコメント内に二重波かっこの実例を書かないこと（置換対象として拾われる）。
  * 見た目だけ変えたいときは、このファイルの <style> を編集すれば report.mjs を触らなくてよい。
-->
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — build-kit レポート</title>
<style>
:root{
  color-scheme: light;
  --bg:#fff; --subtle:#f6f8fa; --line:#d1d9e0; --line-soft:#e4e8ed;
  --fg:#1f2328; --dim:#59636e; --accent:#0969da;
  --ok:#1a7f37; --ok-bg:#dafbe1; --warn:#9a6700; --warn-bg:#fff8c5;
  --bad:#d1242f; --bad-bg:#ffebe9;
  --add-bg:#e6ffec; --add-gut:#ccffd8; --del-bg:#ffebe9; --del-gut:#ffd7d5;
  --hunk-bg:#ddf4ff; --hunk-fg:#0550ae; --tab-active:#fd8c73;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.7;font-size:15px;overflow-x:hidden}
.wrap{max-width:56rem;margin:0 auto;padding:2.5rem 1.25rem 5rem}

header{border-bottom:1px solid var(--line);padding-bottom:1.25rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 .4rem}
h1{font-size:1.55rem;line-height:1.35;margin:0 0 .5rem;font-weight:650}
.meta{color:var(--dim);font-size:.85rem;margin:0}
.links{display:flex;gap:1rem;margin-top:.7rem;font-size:.85rem}
.links a{color:var(--accent)}
.hdr-verdict{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
.tallies{color:var(--dim);font-size:.83rem}

/* タブ */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:1.75rem 0 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:.6rem .9rem;font:inherit;font-size:.92rem;color:var(--dim);cursor:pointer;
  white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--fg);background:var(--subtle);border-radius:.4rem .4rem 0 0}
.tabs button[aria-selected=true]{color:var(--fg);font-weight:600;border-bottom-color:var(--tab-active)}
.tabs .badge{display:inline-block;margin-left:.4rem;padding:0 .4rem;border-radius:999px;
  background:var(--subtle);border:1px solid var(--line-soft);font-size:.75rem;color:var(--dim)}
[role=tabpanel][hidden]{display:none}

section{margin:2rem 0 0}
h2{font-size:1rem;margin:0 0 .6rem;font-weight:650;padding-bottom:.4rem;border-bottom:1px solid var(--line-soft)}
.lead{color:var(--dim);font-size:.85rem;margin:0 0 .8rem}
.summary{margin:1rem 0 0}

.verdict{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  background:var(--subtle);border:1px solid var(--line);border-radius:.6rem;padding:.85rem 1rem;margin-top:1.5rem}
.vnote{font-weight:600}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.75rem;font-weight:600;
  white-space:nowrap;border:1px solid transparent}
.pill.lg{font-size:.85rem;padding:.15rem .7rem}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:#a7e6b8}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:#eedb8c}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:#f5b7b3}
.pill.neutral{background:var(--subtle);color:var(--dim);border-color:var(--line)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:32rem}
th{text-align:left;font-size:.74rem;color:var(--dim);font-weight:600;
  padding:.4rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.flag td{background:var(--bad-bg)}
.num{color:var(--dim)}
.mono{font-family:var(--mono)}
.small{font-size:.82rem}
.dim{color:var(--dim)}
.empty{color:var(--dim);font-style:italic;margin:0}
.empty.pad{padding:.7rem 1rem}
.ok-text{color:var(--ok);margin:0}
.bad-text{color:var(--bad);margin:0 0 .5rem}
.a{color:var(--ok);font-weight:600}
.d{color:var(--bad);font-weight:600}

ul.notes,ol.criteria{margin:0;padding-left:1.3rem}
ul.notes li,ol.criteria li{margin:.3rem 0}
ul.files{list-style:none;margin:0;padding:0}
ul.files li{padding:.28rem .6rem;border-bottom:1px solid var(--line-soft)}
ul.files li:last-child{border-bottom:0}
ul.bad-list li{color:var(--bad)}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line-soft)}
ul.tasks li:last-child{border-bottom:0}
.tick{color:var(--ok);font-weight:700;flex:none;width:1rem}
li.todo .tick{color:var(--dim)}
.t-name{font-weight:550}
.t-sub{color:var(--dim);font-size:.82rem}

details.check,details.file{background:var(--bg);border:1px solid var(--line);
  border-radius:.5rem;margin:.6rem 0;overflow:hidden}
details.check summary,details.file summary{cursor:pointer;padding:.55rem .8rem;display:flex;
  align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--subtle);list-style:none}
details.check summary::-webkit-details-marker,details.file summary::-webkit-details-marker{display:none}
details.check summary::before,details.file summary::before{content:"▸";color:var(--dim);font-size:.8rem}
details[open]>summary::before{content:"▾"}
details.check summary code{background:transparent;color:var(--dim)}
.fname{font-weight:600;font-size:.86rem}
.stat{margin-left:auto;font-size:.8rem;font-family:var(--mono)}
pre.out{margin:0;padding:.8rem 1rem;background:var(--bg);border-top:1px solid var(--line);
  overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.5;white-space:pre}

/* 差分 */
table.diff{min-width:0;font-family:var(--mono);font-size:.78rem;line-height:1.55;
  border-top:1px solid var(--line);table-layout:auto}
table.diff td{padding:0;border:0;vertical-align:top}
table.diff td.ln{width:1%;min-width:2.9rem;padding:0 .55rem;text-align:right;
  color:var(--dim);background:var(--subtle);border-right:1px solid var(--line-soft);
  user-select:none;white-space:nowrap;font-size:.74rem}
table.diff td.code{padding:0 .6rem;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
table.diff .sign{display:inline-block;width:1ch;color:var(--dim)}
tr.add td.code{background:var(--add-bg)} tr.add td.ln{background:var(--add-gut)}
tr.add .sign{color:var(--ok)}
tr.del td.code{background:var(--del-bg)} tr.del td.ln{background:var(--del-gut)}
tr.del .sign{color:var(--bad)}
tr.hunk td{background:var(--hunk-bg);color:var(--hunk-fg);padding:.15rem .6rem;font-size:.75rem}
tr.meta td.code{color:var(--dim);font-style:italic}

footer{margin-top:3.5rem;padding-top:1rem;border-top:1px solid var(--line);
  color:var(--dim);font-size:.78rem}
@media(max-width:38rem){h1{font-size:1.3rem}.wrap{padding:1.75rem 1rem 4rem}}
</style>
</head><body><div class="wrap">

<header>
  <p class="eyebrow">build-kit レポート</p>
  <h1>{{TITLE}}</h1>
  <p class="meta">{{META}}</p>
  <div class="hdr-verdict">
    <span class="pill {{VERDICT_CLASS}}">{{VERDICT}}</span>
    <span class="tallies">{{TALLIES}}</span>
  </div>
  {{LINKS}}
</header>

<div class="tabs" role="tablist">
  <button role="tab" id="t-plan" aria-controls="p-plan" aria-selected="true">計画<span class="badge">{{BADGE_PLAN}}</span></button>
  <button role="tab" id="t-change" aria-controls="p-change" aria-selected="false">変更内容<span class="badge">{{BADGE_CHANGE}}</span></button>
  <button role="tab" id="t-verdict" aria-controls="p-verdict" aria-selected="false">総評</button>
</div>

<div role="tabpanel" id="p-plan" aria-labelledby="t-plan">{{PANEL_PLAN}}</div>
<div role="tabpanel" id="p-change" aria-labelledby="t-change">{{PANEL_CHANGE}}</div>
<div role="tabpanel" id="p-verdict" aria-labelledby="t-verdict">{{PANEL_VERDICT}}</div>

<footer>build-kit {{DATE}} — このレポートは生成物です。コミットしないでください。</footer>
</div>
<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
  function show(id){
    tabs.forEach(function(t){
      var on=t.id===id, p=document.getElementById(t.getAttribute('aria-controls'));
      t.setAttribute('aria-selected',on?'true':'false');
      if(p) p.hidden=!on;
    });
    if(history.replaceState) history.replaceState(null,'','#'+id);
  }
  tabs.forEach(function(t){
    t.addEventListener('click',function(){show(t.id);});
    t.addEventListener('keydown',function(e){
      var i=tabs.indexOf(t), n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:-1;
      if(n>=0&&n<tabs.length){tabs[n].focus();show(tabs[n].id);e.preventDefault();}
    });
  });
  var h=location.hash.replace('#','');
  show(tabs.some(function(t){return t.id===h;})?h:'t-plan');   // JS 無効時は全パネルが見える
})();
</script>
</body></html>
